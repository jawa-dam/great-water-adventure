<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Water Adventure — Adam the Dam Beaver | GEI</title>
<meta name="description" content="Follow Adam the Dam Beaver from the mountain to the mill: an interactive water-engineering adventure for young explorers, with GEI Discovery connections to Genesis 1–6.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10233F; --sub:#33496A; --sky:#E8F6FF; --sky2:#BFE6FF; --line:#CFE3F2;
  --water:#1E88E5; --water2:#4FB3FF; --glow:#2fd2ff;
  --eng:#1565C0; --engBg:#E6F2FF; --engLine:#B5D6F7;
  --gei:#6B2FBF; --geiBg:#F3ECFF; --geiLine:#D8C6F7; --mag:#C0168F;
  --good:#0F8A4C; --warn:#B45309;
  --radius:22px;
  --st:#4F46E5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:Fredoka,Nunito,sans-serif;line-height:1.15;margin:0}
button,input,select{font:inherit}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:4px solid #FFB020;outline-offset:3px;border-radius:10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:18px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;box-shadow:0 4px 0 var(--ink)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.big{min-height:64px;font-size:clamp(18px,2.2vw,23px);padding:0 30px}
.btn.go{background:linear-gradient(180deg,#2FB5FF,#1565C0);color:#fff;border-color:#0B3E7A;box-shadow:0 5px 0 #0B3E7A}
.btn.go:hover{box-shadow:0 7px 0 #0B3E7A}
.btn.sun{background:#FFD23F;border-color:#8A5A00;box-shadow:0 5px 0 #8A5A00;color:#3B2600}
.btn.purple{background:var(--gei);color:#fff;border-color:#3D1773;box-shadow:0 4px 0 #3D1773}
.btn.small{min-height:46px;font-size:16px;padding:0 16px}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.pulse-btn{animation:btnpulse 2.4s ease-in-out infinite}
@keyframes btnpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ---------- sound bar ---------- */
.soundbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.85);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.soundbar .lbl{font-weight:800;font-size:15px;color:var(--sub)}
.iconbtn{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{background:#FFE0E0}
input[type=range]{accent-color:var(--water);height:32px;min-width:120px;cursor:pointer}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#9AD8FF 0%,#D4F0FF 45%,#F4FBFF 75%,#FFFFFF 100%)}
.hero-scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-weight:700;font-size:18px;color:#0B3E7A;letter-spacing:.5px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2fd2ff,#3d3dea);display:grid;place-items:center;color:#fff;font-size:15px}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:clamp(12px,3vw,40px);padding:clamp(14px,3vw,30px) 0 clamp(40px,6vw,80px)}
.hero h1{font-size:clamp(40px,6.4vw,82px);color:#0B2E6B;letter-spacing:.5px;text-shadow:0 4px 0 #fff,0 7px 0 rgba(11,46,107,.15)}
.hero h1 .w{color:#1E88E5}
.hero .subtitle{font-size:clamp(19px,2.3vw,26px);font-weight:800;color:#1B3D6E;margin:16px 0 22px;max-width:560px}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px}
.mascot-stage{position:relative;display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:16px 20px;font-weight:800;font-size:clamp(17px,1.8vw,21px);line-height:1.4;color:var(--ink);box-shadow:0 6px 0 rgba(16,35,63,.18)}
.bubble.down::after{content:"";position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);border:12px solid transparent;border-top:14px solid var(--ink)}
.bubble.down::before{content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);border:10px solid transparent;border-top:12px solid #fff;z-index:1}
.hero .bubble{max-width:520px;margin-bottom:22px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both .3s}
.hero-mascot{width:min(100%,520px);aspect-ratio:1/1;position:relative}
.hero-mascot .glowring{position:absolute;inset:6% 6% 2%;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,rgba(255,255,255,.7) 45%,rgba(255,255,255,0) 70%)}
.mascot{width:100%;height:100%;object-fit:contain;position:relative;filter:drop-shadow(0 16px 18px rgba(11,46,107,.28));transform-origin:50% 90%}
.hero .mascot{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.mascot-fallback{display:none;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fe3ff,#1e88e5 55%,#3d3dea);border:6px solid #fff;box-shadow:0 12px 24px rgba(11,46,107,.25);color:#fff;place-items:center;text-align:center;font-family:Fredoka,sans-serif}
.mascot-fallback b{display:block;font-size:clamp(30px,6vw,64px);line-height:1}
.mascot-fallback span{font-size:clamp(13px,1.6vw,18px);font-weight:600;opacity:.95}
.no-mascot .mascot{display:none}
.no-mascot .mascot-fallback{display:grid}
.wave-edge{position:absolute;left:0;right:0;bottom:-1px;height:60px;z-index:1}
@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;text-align:center}
  .hero .subtitle{margin-left:auto;margin-right:auto}
  .hero-btns{justify-content:center}
  .mascot-stage{order:-1}
  .hero-mascot{width:min(68vw,320px)}
  .hero .bubble{margin-bottom:14px}
}

/* ---------- sections ---------- */
section{scroll-margin-top:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:40px 0 16px}
.sec-head h2{font-size:clamp(28px,4vw,44px);color:#0B2E6B}
.sec-head p{margin:6px 0 0;color:var(--sub);font-weight:700}
.kicker{display:inline-block;font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;letter-spacing:1.5px;color:#1565C0;background:#E3F2FF;border-radius:999px;padding:4px 12px;margin-bottom:8px}

/* ---------- journey map ---------- */
.mapbox{position:relative;border-radius:var(--radius);overflow:hidden;border:3px solid #0B3E7A;background:linear-gradient(180deg,#BFE6FF 0%,#E9F7FF 50%,#7CC46E 50%,#5FA956 100%);aspect-ratio:16/9;box-shadow:0 10px 0 rgba(11,62,122,.12)}
@media (max-width:700px){.mapbox{aspect-ratio:1/1}}
#J{display:block;width:100%;height:100%}
.map-bubble{position:relative;margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:800;font-size:clamp(14px,1.7vw,18px);line-height:1.35;box-shadow:0 4px 0 rgba(16,35,63,.2);z-index:3}
.map-bubble .who{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;color:var(--st)}
.map-tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:14px 0 6px}
.stepper{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:10px}
@media (max-width:900px){.stepper{grid-template-columns:repeat(4,1fr)}}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:8px 4px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(13px,1.4vw,16px);line-height:1.1;text-align:center;transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px)}
.step .n{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c,#1565C0);color:#fff;font-size:18px}
.step[aria-current="step"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:0 4px 0 var(--c)}
.step .done{position:absolute;top:-8px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;display:none;place-items:center;border:2px solid #fff}
.step.is-done .done{display:grid}
.step .done svg{width:14px;height:14px}

/* SVG journey animation classes */
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-360px)}to{transform:translateX(1900px)}}
.bird{animation:fly linear infinite}
@keyframes fly{from{transform:translate(-120px,0)}to{transform:translate(1750px,-60px)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
.flow{stroke-dasharray:16 20;animation:flowd 1.1s linear infinite}
.flow.slow{animation-duration:1.8s}
@keyframes flowd{to{stroke-dashoffset:-36}}
.spin{transform-box:fill-box;transform-origin:center}
.sparkle{animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.bubbleup{animation:bubbleup 1.8s ease-in infinite}
@keyframes bubbleup{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.snow{animation:snowfall linear infinite}
@keyframes snowfall{from{transform:translateY(-40px)}to{transform:translateY(240px)}}
.grain{animation:grain 1.2s linear infinite}
@keyframes grain{from{transform:translateY(0);opacity:1}to{transform:translateY(14px);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sunray{transform-box:fill-box;transform-origin:center;animation:spinr 40s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes spinl{to{transform:rotate(-360deg)}}

.sp{opacity:0;transition:opacity .7s;pointer-events:none}
#J.at-1 .sp1,#J.at-2 .sp2,#J.at-3 .sp3,#J.at-4 .sp4,#J.at-5 .sp5,#J.at-6 .sp6,#J.at-7 .sp7,#J.at-8 .sp8{opacity:1}
#jRes{transition:transform 2.2s ease;transform:translateY(46px)}
#J.r4 #jRes{transform:none}
#jPond{transition:transform 2.2s ease;transform:translateY(52px)}
#J.r5 #jPond{transform:none}
#jGate{transition:transform 2s ease}
#J.r6 #jGate{transform:translateY(-38px)}
#jHand{transition:transform 2s ease}
#J.r6 #jHand{transform:rotate(540deg)}
.wet{opacity:0;transition:opacity 1s .2s}
#J.r4 .wet4,#J.r6 .wet6,#J.r8 .wet8{opacity:1}
#J.r6 #jWheel{animation:spinr 5s linear infinite}
#J.at-7 #jWheel,#J.at-8 #jWheel{animation-duration:3s}
#J.r6 .gearA{animation:spinr 3s linear infinite}
#J.r6 .gearB{animation:spinl 1.6s linear infinite}
#J.r8 .stoneR{animation:spinr 2s linear infinite}
.stop{cursor:pointer}
.stop circle.ring{fill:#fff;stroke:var(--sc);stroke-width:5;transition:r .3s}
.stop .bg{fill:var(--sc)}
.stop text{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;fill:#fff;pointer-events:none}
.stop:hover .bg,.stop:focus-visible .bg{filter:brightness(1.15)}
.stop:focus-visible{outline:none}
.stop:focus-visible circle.ring{stroke:#FFB020;stroke-width:8}
.stop.on circle.halo{animation:halo 1.6s ease-out infinite}
@keyframes halo{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
.halo{transform-box:fill-box;transform-origin:center;opacity:0;fill:none;stroke-width:5}
.hl{fill:rgba(255,210,63,.18);stroke:#FFB020;stroke-width:5;stroke-dasharray:14 10;opacity:0;transition:opacity .5s;pointer-events:none;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-48}}
#J.at-1 .hl1,#J.at-2 .hl2,#J.at-3 .hl3,#J.at-4 .hl4,#J.at-5 .hl5,#J.at-6 .hl6,#J.at-7 .hl7,#J.at-8 .hl8{opacity:1}
#mapAdam{transition:transform 1s cubic-bezier(.5,1.4,.5,1)}
#mapAdam .hop{animation:hop 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-16px)}90%{transform:translateY(0) scaleY(.95)}}

/* ---------- station card ---------- */
.station{position:relative;margin-top:22px;border-radius:30px;border:3px solid var(--st);background:#fff;overflow:hidden;box-shadow:0 10px 0 color-mix(in srgb,var(--st) 25%,transparent)}
.st-band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px;background:linear-gradient(90deg,var(--st),color-mix(in srgb,var(--st) 70%,#2fd2ff));color:#fff}
.st-band .bign{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:#fff;color:var(--st);font-family:Fredoka,sans-serif;font-weight:700;font-size:28px;flex:0 0 auto}
.st-band .eyebrow{font-family:Fredoka,sans-serif;font-weight:600;letter-spacing:2px;font-size:15px;opacity:.95}
.st-band h2{font-size:clamp(26px,3.6vw,40px)}
.st-intro{display:grid;grid-template-columns:minmax(180px,330px) 1fr;gap:clamp(12px,3vw,30px);align-items:center;padding:22px;background:radial-gradient(circle at 20% 40%,color-mix(in srgb,var(--st) 12%,#fff),#fff 70%)}
.st-adam{position:relative;aspect-ratio:1/1;width:100%}
.st-adam .mascot{animation:float 4.5s ease-in-out infinite}
.st-adam.cheer .mascot{animation:cheer .9s ease-in-out 2}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-30px) rotate(-8deg) scale(1.05)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-22px) rotate(8deg) scale(1.04)}}
.st-adam.think .mascot{animation:tilt 1s ease-in-out 2}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
.st-intro .bubble{font-size:clamp(18px,2vw,22px)}
.bubble.left::after{content:"";position:absolute;left:-24px;top:40px;border:12px solid transparent;border-right:14px solid var(--ink)}
.bubble.left::before{content:"";position:absolute;left:-17px;top:42px;border:10px solid transparent;border-right:12px solid #fff;z-index:1}
@media (max-width:760px){
  .st-intro{grid-template-columns:1fr;justify-items:center;text-align:left}
  .st-adam{width:min(72vw,300px)}
  .bubble.left::after,.bubble.left::before{display:none}
}

/* reader */
.reader{margin:0 22px 22px;border:3px solid #0B3E7A;border-radius:24px;background:#F5FBFF;padding:16px}
.reader-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.reader-top .ava{width:64px;height:64px;flex:0 0 auto;position:relative}
.reader-top .ava .mascot{animation:none;filter:none}
.reader-top .ava .mascot-fallback b{font-size:18px}
.reader-top .ava .mascot-fallback span{display:none}
.reader-top h3{font-size:22px;color:#0B3E7A}
.reader-top p{margin:0;font-weight:800;color:var(--sub);font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.seg button{min-height:48px;padding:0 16px;border-radius:999px;border:3px solid #9CC7EA;background:#fff;font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:#0B3E7A;border-color:#0B3E7A;color:#fff}
.seg button.g[aria-pressed="true"]{background:var(--gei);border-color:var(--gei)}
.rctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.rctl{grid-template-columns:repeat(2,minmax(0,1fr))}.rctl .play{grid-column:span 2}}
.rctl .btn{min-width:0;min-height:58px;font-size:17px;padding:0 10px;box-shadow:0 4px 0 #0B3E7A;border-color:#0B3E7A;color:#0B3E7A}
.rctl .btn.play{background:#1565C0;color:#fff}
.rprog{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.rbar{flex:1 1 200px;height:16px;border-radius:999px;background:#DCEBF8;overflow:hidden;border:2px solid #9CC7EA}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd2ff,#1565C0);transition:width .4s}
.rstat{font-weight:800;font-size:15px;color:var(--sub);min-width:150px}
.ropts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;font-weight:800;font-size:15px;color:var(--sub)}
.ropts label{display:flex;align-items:center;gap:8px}
.ropts select{min-height:44px;border-radius:12px;border:2px solid #9CC7EA;padding:0 10px;max-width:260px;background:#fff}
.rmsg{margin:10px 0 0;padding:10px 14px;border-radius:14px;background:#FFF4D6;color:#5A3B00;font-weight:800;font-size:15px;display:none}
.speaking{background:#FFE98A;border-radius:6px;box-shadow:0 0 0 4px #FFE98A;transition:background .2s}

/* learning panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media (max-width:900px){.panels{grid-template-columns:1fr}}
.pane{padding:22px}
.pane.eng{background:var(--engBg);border-top:3px solid var(--engLine)}
.pane.gei{background:var(--geiBg);border-top:3px solid var(--geiLine)}
@media (min-width:901px){.pane.gei{border-left:3px solid var(--geiLine)}}
.tagline{display:inline-flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-weight:600;letter-spacing:1.5px;font-size:15px;border-radius:999px;padding:5px 14px;color:#fff}
.pane.eng .tagline{background:var(--eng)}
.pane.gei .tagline{background:var(--gei)}
.pane h3{font-size:clamp(22px,2.4vw,28px);margin:12px 0 8px}
.pane.eng h3{color:#0B3E7A}
.pane.gei h3{color:#3D1773}
.pane p{margin:0 0 12px}
.howit{background:#fff;border:2px solid var(--engLine);border-radius:18px;padding:12px 16px;margin:14px 0}
.howit strong{font-family:Fredoka,sans-serif;font-weight:600;color:#0B3E7A}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.word{background:#fff;border:2px solid var(--engLine);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.word b{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;color:var(--eng)}
.word span{font-size:16px;line-height:1.45}
.word button{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--eng);background:#fff;color:var(--eng);font-weight:800;font-size:15px;cursor:pointer}
.word button svg{width:18px;height:18px}
.verse{background:#fff;border:2px solid var(--geiLine);border-radius:18px;padding:14px 16px;margin:12px 0}
.verse q{display:block;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:18px;line-height:1.5;color:#2A1554;quotes:"\201C" "\201D"}
.verse cite{display:block;margin-top:6px;font-style:normal;font-weight:800;font-size:15px;color:var(--gei)}
.wonder{display:block;background:#fff;border:3px dashed var(--gei);border-radius:18px;padding:12px 16px;margin-top:12px;font-weight:700}
.wonder b{display:block;font-family:Fredoka,sans-serif;font-size:19px;color:var(--gei);margin-bottom:4px}
.dam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
